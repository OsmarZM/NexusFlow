# ==============================================================================
# NexusFlow — Production Profile Configuration (application-prod.yml)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

nexusflow:
  security:
    admin-password: ${NEXUSFLOW_ADMIN_PASSWORD}
    jwt:
      secret-key: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: nexusflow-auth-service
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nexusflow.io,https://app.nexusflow.io}
  rate-limit:
    enabled: true
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens-per-minute: ${RATE_LIMIT_REFILL_PER_MINUTE:100}

logging:
  level:
    root: INFO
    com.nexusflow: INFO
    org.hibernate: WARN
